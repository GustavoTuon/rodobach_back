name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  NODE_ENV: test
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_NAME: rodobach_test
  DB_USER: rodobach_test
  DB_PASSWORD: rodobach_test
  JWT_SECRET: ci-only-jwt-secret-with-32-characters
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rodobach_test
          POSTGRES_USER: rodobach_test
          POSTGRES_PASSWORD: rodobach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rodobach_test -d rodobach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t rodobach-back:test .
